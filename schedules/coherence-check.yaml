id: coherence-check
cron: "0 * * * *"
scope: coherence
depends_on: ["integrate"]
preconditions:
  - {kind: "exists", path: "/work/projects/registry.json"}
  - {kind: "gate", gate_id: "stop-honored"}
effects:
  - {kind: "run", cmd: "python3 /work/runtime/executor.py coherence measure"}
  - {kind: "run", cmd: "python3 /work/runtime/executor.py coherence record"}
  - {kind: "evidence", path: "/work/evidence/coherence-<n>.json"}
postconditions:
  - {kind: "exists", path: "/work/reports/coherence.json"}
retry: {on: ["io_error"], max: 2, backoff: "linear"}
rollback: []
policy: {autonomous: true, human_gate: none, budget_minutes: 5, on_fail: "continue"}
