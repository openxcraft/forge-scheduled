id: docs-refresh
cron: "0 */4 * * *"
scope: docs
depends_on: ["integrate"]
preconditions:
  - {kind: "exists", path: "/work/projects/registry.json"}
  - {kind: "gate", gate_id: "stop-honored"}
effects:
  - {kind: "run", cmd: "python3 /work/runtime/executor.py docs regenerate-all"}
  - {kind: "run", cmd: "python3 /work/runtime/gates.py docs-executable"}
  - {kind: "evidence", path: "/work/evidence/docs-refresh-<n>.json"}
postconditions:
  - {kind: "gate", gate_id: "docs-executable"}
retry: {on: ["gate_failed", "io_error"], max: 2, backoff: "exponential"}
rollback: []
policy: {autonomous: true, human_gate: none, budget_minutes: 15, on_fail: "continue"}
