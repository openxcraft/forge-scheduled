id: plan-hour
cron: "0 * * * *"
scope: roadmap-hour
depends_on: ["plan-day"]
preconditions:
  - {kind: "exists", path: "/work/projects/registry.json"}
  - {kind: "gate", gate_id: "stop-honored"}
effects:
  - {kind: "llm", prompt_template: "hour-plan", output: "/work/projects/<active>/roadmap/hour.json", schema: "roadmap"}
  - {kind: "decide", path: "/work/decisions/cycle-<n>-hour-plan.json", question: "hour roadmap revision", options: ["revise", "keep"], chosen: "revise", verified_by: "decision-present"}
  - {kind: "evidence", path: "/work/evidence/cycle-<n>-hour-plan.json"}
postconditions:
  - {kind: "gate", gate_id: "decision-present"}
  - {kind: "gate", gate_id: "evidence-present"}
retry: {on: ["llm_failed", "io_error"], max: 3, backoff: "exponential"}
rollback: [{kind: "run", cmd: "git -C /work checkout -- projects/$(python3 -c \"import json;print(json.load(open(\"/work/projects/registry.json\"))[\"active\"])\")/roadmap/hour.json"}]
policy: {autonomous: true, human_gate: none, budget_minutes: 5, on_fail: "continue"}
