id: dependency-graph
cron: "0 */2 * * *"
scope: graph
depends_on: ["integrate"]
preconditions:
  - {kind: "exists", path: "/work/projects/registry.json"}
  - {kind: "gate", gate_id: "stop-honored"}
effects:
  - {kind: "run", cmd: "python3 /work/runtime/contracts.py rebuild-graph"}
  - {kind: "run", cmd: "python3 /work/runtime/contracts.py detect-cycles"}
  - {kind: "evidence", path: "/work/evidence/graph-<n>.json"}
postconditions:
  - {kind: "exists", path: "/work/projects/graph.json"}
  - {kind: "command", cmd: "python3 -c \"import json,sys; g=json.load(open(\"/work/projects/graph.json\")); sys.exit(0 if not g.get(\"cycles\") else 1)\""}
retry: {on: ["io_error"], max: 2, backoff: "linear"}
rollback: []
policy: {autonomous: true, human_gate: none, budget_minutes: 5, on_fail: "continue"}
